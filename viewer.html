<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WarpORacer · Mojo</title>
  <style>
    :root { color-scheme: dark; font: 14px system-ui, sans-serif; color: #e6edf3; background: #10171e; }
    body { margin: 0; overflow: hidden; } canvas { display: block; }
    aside { position: absolute; top: 16px; left: 16px; width: 270px; padding: 16px; background: #14212bee;
      border: 1px solid #34424f; border-radius: 12px; box-shadow: 0 10px 40px #0005; }
    h1 { font-size: 18px; margin: 0 0 4px; } small, .muted, dt { color: #94a7b5; }
    button, select { background: #233542; color: inherit; border: 1px solid #425464; border-radius: 6px; padding: 6px; cursor: pointer; }
    .row { display: flex; gap: 6px; margin: 10px 0; } .row > * { flex: 1; }
    label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
    dl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 14px 0; } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    #status { color: #78dbb6; min-height: 20px; } #error { color: #ffaf9d; white-space: pre-wrap; } input { accent-color: #78dbb6; }
  </style>
  <aside>
    <h1>WarpORacer <small>Mojo</small></h1>
    <div class="muted" id="map">Loading track…</div>
    <div class="row"><button id="pause">Pause</button><button id="reset">Reset cars</button><button id="step">Step</button></div>
    <label>Driver <select id="driver"><option value="manual">Keyboard</option><option value="policy">Policy</option></select></label>
    <label>Camera <select id="camera"><option value="follow">Follow</option><option value="orbit">Orbit</option><option value="top">Top</option></select></label>
    <label>Car <select id="car"></select></label>
    <label>Speed <select id="rate"><option value="0.25">¼×</option><option value="1" selected>1×</option><option value="4">4×</option></select></label>
    <label>Lidar <input id="lidar" type="checkbox" checked /></label>
    <label>Route <input id="route" type="checkbox" checked /></label>
    <dl>
      <dt>Speed</dt><dd id="speed">—</dd>
      <dt>Grade / height</dt><dd id="grade">—</dd>
      <dt>Steering / throttle</dt><dd id="control">—</dd>
      <dt>Episode return</dt><dd id="reward">—</dd>
      <dt>Waypoint</dt><dd id="progress">—</dd>
      <dt>Resets / crashes</dt><dd id="events">0 / 0</dd>
    </dl>
    <div id="status" aria-live="polite">Starting simulation…</div>
    <div id="error" aria-live="polite"></div>
    <p class="muted">W/S or ↑/↓: throttle · A/D or ←/→: steer<br />Space: pause · R: reset · Drag to orbit</p>
  </aside>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                   "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const $ = (id) => document.getElementById(id);
    const info = await (await fetch("/info")).json();
    const d = new Float32Array(await (await fetch("/map")).arrayBuffer());
    // Track array (racer/track.py): header, then per layer the clearance, height and
    // nearest-waypoint grids (row-major, a float per cell), then the route (x, y, z, heading).
    const [nx, ny, x0, y0, cell, waypoints, , layers] = d, cells = nx * ny;
    const grid = (layer, which) => d.subarray(12 + (3 * layer + which) * cells, 12 + (3 * layer + which + 1) * cells);
    const route = d.subarray(12 + 3 * layers * cells, 12 + 3 * layers * cells + waypoints * 4);
    const FOV = 1.5 * Math.PI, WALL = 0.5; // lidar field of view; how far wall cells rise above the road
    const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

    $("map").textContent = `${info.name} · ${info.cars} cars · ${layers} layer${layers > 1 ? "s" : ""}`;
    $("driver").value = info.policy ? "policy" : "manual";
    $("driver").options[1].disabled = !info.policy;
    for (let i = 0; i < info.cars; i++) $("car").add(new Option(i + 1, i));

    THREE.Object3D.DEFAULT_UP.set(0, 0, 1);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e161c);
    const sun = new THREE.DirectionalLight(0xffffff, 1.4);
    sun.position.set(0.3, -0.4, 0.86);
    scene.add(new THREE.HemisphereLight(0xbfd4e6, 0x2a2420, 0.9), sun);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.prepend(renderer.domElement);
    const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 1000);
    const centre = new THREE.Vector3(x0 + ((nx - 1) * cell) / 2, y0 + ((ny - 1) * cell) / 2, 0), extent = Math.max(nx, ny) * cell;
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(centre);
    const overview = centre.clone().addScaledVector(new THREE.Vector3(0.6, -0.8, 0.7), extent);
    function orbit() { camera.position.copy(overview); $("camera").value = "orbit"; } // entering orbit mode restarts from the overview
    $("camera").onchange = () => $("camera").value === "orbit" && orbit();
    renderer.domElement.addEventListener("pointerdown", () => $("camera").value !== "orbit" && orbit());
    camera.position.copy(overview);

    // One mesh per layer, a vertex per cell: road cells in asphalt, the band just outside
    // raised as a wall, cells farther out left unmeshed. Lambert shading shows the slopes.
    const road = new THREE.Color(0x4a5560), wall = new THREE.Color(0xa6412e);
    for (let l = 0; l < layers; l++) {
      const clearance = grid(l, 0), height = grid(l, 1), shown = (k) => clearance[k] > -0.4;
      const position = new Float32Array(cells * 3), colour = new Float32Array(cells * 3);
      const index = new Uint32Array((nx - 1) * (ny - 1) * 6);
      let n = 0;
      for (let k = 0; k < cells; k++) {
        position.set([x0 + (k % nx) * cell, y0 + Math.floor(k / nx) * cell, height[k] + (clearance[k] > 0 ? 0 : WALL)], 3 * k);
        (clearance[k] > 0 ? road : wall).toArray(colour, 3 * k);
      }
      for (let iy = 0; iy + 1 < ny; iy++)
        for (let ix = 0; ix + 1 < nx; ix++) {
          const k = iy * nx + ix;
          if (!shown(k) || !shown(k + 1) || !shown(k + nx) || !shown(k + nx + 1)) continue;
          index.set([k, k + 1, k + nx, k + 1, k + nx + 1, k + nx], n);
          n += 6;
        }
      const geometry = new THREE.BufferGeometry().setIndex(new THREE.BufferAttribute(index.subarray(0, n), 1));
      geometry.setAttribute("position", new THREE.BufferAttribute(position, 3)).setAttribute("color", new THREE.BufferAttribute(colour, 3));
      geometry.computeVertexNormals();
      scene.add(new THREE.Mesh(geometry, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide })));
    }
    const loop = Array.from({ length: waypoints + 1 }, (_, w) => route.subarray((w % waypoints) * 4, (w % waypoints) * 4 + 3));
    const routeGeometry = new THREE.BufferGeometry().setFromPoints(loop.map(([x, y, z]) => new THREE.Vector3(x, y, z + 0.02)));
    const routeLine = new THREE.Line(routeGeometry, new THREE.LineBasicMaterial({ color: 0x55a6b3 }));
    const cars = new THREE.InstancedMesh(new THREE.BoxGeometry(0.58, 0.42, 0.15), new THREE.MeshLambertMaterial(), info.cars);
    const beamGeometry = new THREE.BufferGeometry().setAttribute("position", new THREE.BufferAttribute(new Float32Array(info.beams * 6), 3));
    const lidar = new THREE.LineSegments(beamGeometry, new THREE.LineBasicMaterial({ color: 0x5d93a8, transparent: true, opacity: 0.7 }));
    cars.frustumCulled = lidar.frustumCulled = false; // their bounds are only computed once, before anything moves
    scene.add(routeLine, cars, lidar);

    // Snapshots are feature-major: state rows, observation rows, two action rows, reward, done.
    const [X, Y, Z, HEADING, SPEED, STEER, PROGRESS, EPISODE, RETURN] = [0, 1, 2, 3, 4, 5, 7, 8, 10];
    const BEAM = info.state + 4, THROTTLE = info.state + info.obs + 1, DONE = THROTTLE + 2;
    let snap = null, paused = false, reset = false, resets = 0, crashes = 0;
    const at = (row, i) => snap[row * info.cars + i];
    const episodes = Array(info.cars).fill(-1), keys = new Set();

    function slope(x, y, z) {
      // Bilinear height gradient of the drivable layer nearest z, the one the sim drives on.
      const fx = (x - x0) / cell, fy = (y - y0) / cell;
      const ix = clamp(Math.floor(fx), 0, nx - 2), iy = clamp(Math.floor(fy), 0, ny - 2), k = iy * nx + ix;
      const tx = clamp(fx - ix, 0, 1), ty = clamp(fy - iy, 0, 1);
      let best = 0, gap = Infinity;
      for (let l = 0; l < layers; l++) {
        const g = Math.abs(grid(l, 1)[k] - z);
        if (grid(l, 0)[k] > 0 && g < gap) [best, gap] = [l, g];
      }
      const h = grid(best, 1);
      return [((h[k + 1] - h[k]) * (1 - ty) + (h[k + nx + 1] - h[k + nx]) * ty) / cell, ((h[k + nx] - h[k]) * (1 - tx) + (h[k + nx + 1] - h[k + 1]) * tx) / cell];
    }
    function frame(i) {
      // Car i's position and tilted basis: forward follows the slope, up is the terrain normal.
      const h = at(HEADING, i), [sx, sy] = slope(at(X, i), at(Y, i), at(Z, i));
      const forward = new THREE.Vector3(Math.cos(h), Math.sin(h), sx * Math.cos(h) + sy * Math.sin(h)).normalize();
      const up = new THREE.Vector3(-sx, -sy, 1).normalize();
      return { position: new THREE.Vector3(at(X, i), at(Y, i), at(Z, i)), forward, up, left: up.clone().cross(forward) };
    }
    const matrix = new THREE.Matrix4(), selectedColour = new THREE.Color(0xfaa645), otherColour = new THREE.Color(0x4fb0a3);
    function drawCars(selected) {
      for (let i = 0; i < info.cars; i++) {
        const { position, forward, up, left } = frame(i);
        cars.setMatrixAt(i, matrix.makeBasis(forward, left, up).setPosition(position.addScaledVector(up, 0.075)));
        cars.setColorAt(i, i === selected ? selectedColour : otherColour);
      }
      cars.instanceMatrix.needsUpdate = cars.instanceColor.needsUpdate = true;
    }
    function drawLidar(i) {
      const { position, forward, left } = frame(i), p = lidar.geometry.attributes.position;
      const origin = position.addScaledVector(forward, info.mount[0]).add(new THREE.Vector3(0, 0, info.mount[2]));
      for (let b = 0; b < info.beams; b++) {
        const az = -FOV / 2 + (b * FOV) / (info.beams - 1), r = at(BEAM + b, i) * info.range;
        const end = origin.clone().addScaledVector(forward, r * Math.cos(az)).addScaledVector(left, r * Math.sin(az));
        p.setXYZ(2 * b, origin.x, origin.y, origin.z);
        p.setXYZ(2 * b + 1, end.x, end.y, end.z);
      }
      p.needsUpdate = true;
    }
    function render() {
      const i = Number($("car").value), mode = $("camera").value;
      camera.up.set(0, mode === "top" ? 1 : 0, mode === "top" ? 0 : 1); // looking straight down, keep north up
      routeLine.visible = $("route").checked;
      lidar.visible = Boolean(snap) && $("lidar").checked;
      if (snap) {
        drawCars(i);
        if (lidar.visible) drawLidar(i);
        const { position, forward } = frame(i);
        if (mode === "follow") {
          camera.position.copy(position).addScaledVector(forward, -2.5).add(new THREE.Vector3(0, 0, 1.3));
          camera.lookAt(position.x, position.y, position.z + 0.3);
        }
        $("speed").textContent = at(SPEED, i).toFixed(2) + " m/s";
        $("grade").textContent = ((Math.asin(forward.z) * 180) / Math.PI).toFixed(1) + "° / " + position.z.toFixed(2) + " m";
        $("control").textContent = ((at(STEER, i) * 180) / Math.PI).toFixed(1) + "° / " + clamp(at(THROTTLE, i), -1, 1).toFixed(2);
        $("reward").textContent = at(RETURN, i).toFixed(1);
        $("progress").textContent = at(PROGRESS, i).toFixed(1) + " / " + waypoints;
        $("events").textContent = resets + " / " + crashes;
      }
      if (mode === "top") camera.position.set(centre.x, centre.y, extent), camera.lookAt(centre);
      else if (mode === "orbit") controls.update();
      renderer.render(scene, camera);
    }
    function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
    addEventListener("resize", resize);
    resize();
    renderer.setAnimationLoop(render);

    const togglePause = () => ($("pause").textContent = (paused = !paused) ? "Play" : "Pause");
    $("pause").onclick = togglePause;
    $("reset").onclick = () => (reset = true);
    $("step").onclick = () => tick();
    addEventListener("keydown", (e) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
      if (e.target.tagName === "SELECT") return;
      keys.add(e.key.toLowerCase());
      if (!e.repeat && e.code === "Space") togglePause();
      if (e.key.toLowerCase() === "r") reset = true;
    });
    addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
    addEventListener("blur", () => keys.clear());

    let busy = false, lastTick = 0;
    async function tick() {
      if (busy) return;
      busy = true;
      try {
        const pressed = (...names) => names.some((k) => keys.has(k));
        const direction = (pressed("a", "arrowleft") ? 1 : 0) - (pressed("d", "arrowright") ? 1 : 0);
        // Actions are steering rates: without input, steer back to centre (STEER_RATE 3.2 rad/s at 60 Hz).
        const current = snap ? at(STEER, Number($("car").value)) : 0;
        const steer = direction ? direction * 100 : clamp((-current * 60 * 100) / 3.2, -100, 100);
        const throttle = ((pressed("w", "arrowup") ? 1 : 0) - (pressed("s", "arrowdown") ? 1 : 0)) * 100;
        const response = await fetch("/step", {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: `${Math.round(steer)} ${throttle} ${reset ? 1 : 0} ${$("driver").value === "policy" ? 1 : 0}`,
        });
        reset = false;
        if (!response.ok) throw Error(await response.text());
        snap = new Float32Array(await response.arrayBuffer());
        for (let i = 0; i < info.cars; i++) {
          if (episodes[i] !== at(EPISODE, i) && episodes[i] >= 0) resets++;
          episodes[i] = at(EPISODE, i);
          if (at(DONE, i) === 1) crashes++;
        }
        $("status").textContent = paused ? "Paused" : $("driver").value === "policy" ? "Policy running" : "Keyboard driving";
      } catch (e) {
        paused = true;
        $("error").textContent = e.message;
        $("status").textContent = "Simulation stopped";
      } finally {
        busy = false;
      }
    }
    async function animate(t) {
      const rate = Number($("rate").value);
      if ((!paused || reset) && t - lastTick >= 1000 / (60 * Math.min(rate, 1))) {
        lastTick = t;
        for (let i = 0; i < Math.max(1, rate); i++) await tick();
      }
      requestAnimationFrame(animate);
    }
    await tick();
    requestAnimationFrame(animate);
  </script>
</html>
