[project]
name = "warporacer3d"
version = "0.2.0"
description = "Mojo racing simulation with terrain-following dynamics, lidar, and PPO"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mojo==1.1.0",
    "max==26.6.0",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
warporacer3d = { path = ".", editable = true }

[tool.pixi.tasks]
