[project]
name = "warporacer3d"
version = "0.3.0"
description = "Mojo racing simulation with terrain-following dynamics, lidar, and PPO"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mojo==1.2.0.dev2026100406",
    "max==26.7.0.dev2026100406",
    "numpy",
    "scipy",
    "scikit-image",
    "pillow",
    "pyyaml",
]

[tool.uv]
prerelease = "allow"
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "modular-nightly"
url = "https://whl.modular.com/nightly/simple/"
